WorkflowName: ApprovalRouting
Rules:
  - RuleName: CapExMustCeo
    Enabled: true
    Properties:
      Priority: "1000"
    Expression: req.ExpenseType == "CapEx" || req.Amount >= 500000
    SuccessEvent: RouteCeo
    Actions:
      OnSuccess:
        Name: OutputExpression
        Context:
          Expression: '"CEO -> FINANCE_VP -> DEPT_DIR"'

  - RuleName: MidAmountDeptDirector
    Enabled: true
    Properties:
      Priority: "500"
    Expression: >-
      req.Amount >= 20000 && req.Amount < 500000 && req.ExpenseType != "CapEx"
      && req.VendorRisk != "High"
      && !(req.ExpenseType == "Marketing" && req.Amount >= 100000)
    SuccessEvent: RouteDeptDir
    Actions:
      OnSuccess:
        Name: OutputExpression
        Context:
          Expression: '"DEPT_DIR -> DEPT_MANAGER"'

  - RuleName: SmallAmountManager
    Enabled: true
    Properties:
      Priority: "100"
    Expression: req.Amount < 20000 && req.ExpenseType != "CapEx"
    SuccessEvent: RouteManager
    Actions:
      OnSuccess:
        Name: OutputExpression
        Context:
          Expression: '"DEPT_MANAGER"'
